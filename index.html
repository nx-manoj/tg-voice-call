<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anonymous Voice Call</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- PeerJS WebRTC Library (Free Peer-to-Peer Audio) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 40px 20px;
    }
    .header { text-align: center; margin-top: 20px; }
    .header h2 { font-size: 24px; font-weight: 700; color: #38bdf8; }
    .header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }

    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }
    .avatar-pulse {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
      70% { box-shadow: 0 0 0 25px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    .status-text {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
    }
    .timer-text {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
    }
    .btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn:active { transform: scale(0.92); }
    .btn-mute { background: #334155; color: white; }
    .btn-mute.muted { background: #ef4444; color: white; }
    .btn-end { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Anonymous Voice Call</h2>
    <p>End-to-End Encrypted • Identity Hidden</p>
  </div>

  <div class="avatar-container">
    <div class="avatar-pulse" id="avatarIcon">🎙️</div>
    <div class="status-text" id="statusText">Connecting...</div>
    <div class="timer-text" id="timerText">00:00</div>
  </div>

  <div class="controls">
    <button class="btn btn-mute" id="muteBtn" onclick="toggleMute()">🎤</button>
    <button class="btn btn-end" onclick="endCall()">📞</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.enableClosingConfirmation();
    }

    // Parse URL parameters: ?room=ROOM_ID&role=caller|receiver
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'test_room';
    const role = urlParams.get('role') || 'caller';

    const myPeerId = `${room}_${role}`;
    const remotePeerId = `${room}_${role === 'caller' ? 'receiver' : 'caller'}`;

    let localStream = null;
    let peer = null;
    let call = null;
    let isMuted = false;
    let seconds = 0;
    let timerInterval = null;

    async function start() {
      try {
        // Request Microphone permission
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        peer = new Peer(myPeerId);

        peer.on('open', (id) => {
          document.getElementById('statusText').innerText = 'Calling stranger...';
          if (role === 'caller') {
            // Initiate the call
            setTimeout(() => {
              callPartner();
            }, 1500);
          }
        });

        peer.on('call', (incomingCall) => {
          document.getElementById('statusText').innerText = 'Connected!';
          incomingCall.answer(localStream);
          handleCall(incomingCall);
        });

        peer.on('error', (err) => {
          console.error(err);
          document.getElementById('statusText').innerText = 'Reconnecting...';
          setTimeout(callPartner, 2000);
        });

      } catch (err) {
        document.getElementById('statusText').innerText = 'Mic permission denied';
        alert('Please allow microphone access to use voice call.');
      }
    }

    function callPartner() {
      if (!peer || call) return;
      document.getElementById('statusText').innerText = 'Ringing stranger...';
      const outgoingCall = peer.call(remotePeerId, localStream);
      if (outgoingCall) {
        handleCall(outgoingCall);
      }
    }

    function handleCall(c) {
      call = c;
      call.on('stream', (remoteStream) => {
        document.getElementById('statusText').innerText = 'In Call 🟢';
        document.getElementById('remoteAudio').srcObject = remoteStream;
        startTimer();
      });

      call.on('close', () => {
        endCall();
      });
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      const muteBtn = document.getElementById('muteBtn');
      if (isMuted) {
        muteBtn.classList.add('muted');
        muteBtn.innerText = '🔇';
      } else {
        muteBtn.classList.remove('muted');
        muteBtn.innerText = '🎤';
      }
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        document.getElementById('timerText').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function endCall() {
      if (timerInterval) clearInterval(timerInterval);
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      if (call) call.close();
      if (peer) peer.destroy();
      document.getElementById('statusText').innerText = 'Call Ended';
      setTimeout(() => {
        if (tg) tg.close();
      }, 800);
    }

    window.onload = start;
  </script>
</body>
</html>
