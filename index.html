<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anonymous Voice Call</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 40px 20px;
    }
    .header { text-align: center; margin-top: 15px; }
    .header h2 { font-size: 22px; font-weight: 700; color: #38bdf8; }
    .header p { color: #94a3b8; font-size: 13px; margin-top: 4px; }

    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }
    .avatar-pulse {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
      70% { box-shadow: 0 0 0 25px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
    .status-text {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 600;
      color: #38bdf8;
    }
    .timer-text {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
    }
    .btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn:active { transform: scale(0.92); }
    .btn-mute { background: #334155; color: white; }
    .btn-mute.muted { background: #ef4444; color: white; }
    .btn-end { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Anonymous Voice Call</h2>
    <p>Encrypted • No phone numbers exchanged</p>
  </div>

  <div class="avatar-container">
    <div class="avatar-pulse" id="avatarIcon">🎙️</div>
    <div class="status-text" id="statusText">Requesting Mic Access...</div>
    <div class="timer-text" id="timerText">00:00</div>
  </div>

  <div class="controls">
    <button class="btn btn-mute" id="muteBtn" onclick="toggleMute()">🎤</button>
    <button class="btn btn-end" onclick="endCall()">📞</button>
  </div>

  <!-- Audio playback element for stranger's voice -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.enableClosingConfirmation();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'test_room';
    const role = urlParams.get('role') || 'caller';

    const myPeerId = `${room}_${role}`;
    const remotePeerId = `${room}_${role === 'caller' ? 'receiver' : 'caller'}`;

    let localStream = null;
    let peer = null;
    let call = null;
    let isMuted = false;
    let seconds = 0;
    let timerInterval = null;

    // Google Free STUN servers to punch through NAT & Mobile firewalls
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' }
        ]
      }
    };

    async function start() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });

        document.getElementById('statusText').innerText = 'Connecting server...';

        peer = new Peer(myPeerId, peerConfig);

        peer.on('open', (id) => {
          document.getElementById('statusText').innerText = 'Waiting for stranger to join...';
          
          if (role === 'caller') {
            // Keep retrying call until receiver opens their WebApp
            const callInterval = setInterval(() => {
              if (call) {
                clearInterval(callInterval);
                return;
              }
              document.getElementById('statusText').innerText = 'Calling stranger...';
              const outgoing = peer.call(remotePeerId, localStream);
              if (outgoing) {
                handleCall(outgoing);
              }
            }, 2000);
          }
        });

        peer.on('call', (incomingCall) => {
          document.getElementById('statusText').innerText = 'Connecting audio...';
          incomingCall.answer(localStream);
          handleCall(incomingCall);
        });

        peer.on('error', (err) => {
          console.error('Peer error:', err);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('statusText').innerText = 'Microphone blocked';
        alert('Please allow microphone permissions in Telegram to speak!');
      }
    }

    function handleCall(c) {
      call = c;

      call.on('stream', (remoteStream) => {
        document.getElementById('statusText').innerText = 'Connected 🟢 (Speaking)';
        const audio = document.getElementById('remoteAudio');
        audio.srcObject = remoteStream;
        audio.play().catch(e => console.log('Audio autoplay retry', e));
        startTimer();
      });

      call.on('close', () => {
        endCall();
      });
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      const muteBtn = document.getElementById('muteBtn');
      if (isMuted) {
        muteBtn.classList.add('muted');
        muteBtn.innerText = '🔇';
      } else {
        muteBtn.classList.remove('muted');
        muteBtn.innerText = '🎤';
      }
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        document.getElementById('timerText').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function endCall() {
      if (timerInterval) clearInterval(timerInterval);
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      if (call) call.close();
      if (peer) peer.destroy();
      document.getElementById('statusText').innerText = 'Call Ended';
      setTimeout(() => {
        if (tg) tg.close();
      }, 600);
    }

    window.onload = start;
  </script>
</body>
</html>
